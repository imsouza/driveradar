services:
  driveradar_core:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1004}
    container_name: driveradar_core
    restart: always
    ports:
      - "127.0.0.1:8512:8512"
    environment:
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.5-flash}
      OPENCODE_ZEN_API_KEY_FILE: /run/secrets/opencode_zen_api_key
      NVIDIA_API_KEY_FILE: /run/secrets/nvidia_api_key
      OPENCODE_ZEN_MODELS: ${OPENCODE_ZEN_MODELS:-mimo-v2.5-free,muse-spark-1.3-contributor-free,muse-spark-1.2-contributor-free,ling-3.0-flash-fin-free,big-pickle,nemotron-3.5-lightning-free,nemotron-3-ultra-free,deepseek-v4-flash-free}
    volumes:
      - ./cache:/app/cache
      - ./releases:/app/releases:ro
    secrets:
      - gemini_api_key
      - opencode_zen_api_key
      - nvidia_api_key

  driveradar_api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1001}
        APP_GID: ${APP_GID:-1004}
    container_name: driveradar_api
    restart: always
    command: uvicorn api:app --host 0.0.0.0 --port 8513
    ports:
      - "127.0.0.1:8513:8513"
    environment:
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-https://optlabs.com.br}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.5-flash}
      OPENCODE_ZEN_API_KEY_FILE: /run/secrets/opencode_zen_api_key
      NVIDIA_API_KEY_FILE: /run/secrets/nvidia_api_key
    volumes:
      - ./cache:/app/cache
      - ./releases:/app/releases:ro
    secrets:
      - gemini_api_key
      - opencode_zen_api_key
      - nvidia_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8513/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  gemini_api_key:
    file: ./.secrets/gemini_api_key
  opencode_zen_api_key:
    file: ./.secrets/opencode_zen_api_key
  nvidia_api_key:
    file: ./.secrets/nvidia_api_key
