name: Build and Release DriveRadar Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Syntax check desktop scripts
        working-directory: desktop
        run: npm run check

      - name: Build Windows installer and portable binary
        working-directory: desktop
        run: npm run build:win

      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/dist/latest.yml")) { throw "Missing latest.yml" }
          Get-ChildItem desktop/dist -Include *.exe,*.blockmap,latest.yml -Recurse | Format-Table Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DriveRadar ${{ github.ref_name }} (Windows)
          body: |
            ## DriveRadar Desktop for Windows (${{ github.ref_name }})

            - **Installer (`DriveRadar-Setup-*.exe`)**: Per-user Windows installer with shortcuts and **automatic background updates** via `https://optlabs.com.br/driveradar/updates/`.
            - **Portable (`DriveRadar-Portable-*.exe`)**: Standalone single-file executable requiring no installation.
            - **System Tray & Native Windows Notifications**: Minimize to the system tray and receive native Windows alerts for new NVIDIA, AMD, Intel, and Windows 11 releases, critical risk warnings, hotfix conflicts, security alerts, and DriveRadar app updates.
            - **Multilingual & Themes**: Full support for English, Portuguese (BR), Spanish, and French (including translated AI summaries) plus 6 curated visual themes and OS theme sync.
          files: |
            desktop/dist/latest.yml
            desktop/dist/*.exe
            desktop/dist/*.blockmap
