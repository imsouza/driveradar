name: Build and Release DriveRadar Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for backend & i18n QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python QA dependencies
        run: pip install -r requirements.txt httpx

      - name: Run full backend & i18n QA suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Syntax check & supply-chain audit desktop scripts
        working-directory: desktop
        run: |
          npm run check
          npm audit --audit-level=high

      - name: Build Windows installer and portable binary
        working-directory: desktop
        run: npm run build:win

      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/dist/latest.yml")) { throw "Missing latest.yml" }
          Get-ChildItem desktop/dist -Include *.exe,*.blockmap,latest.yml -Recurse | Format-Table Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DriveRadar ${{ github.ref_name }} (Windows)
          body: |
            ## DriveRadar Desktop for Windows (${{ github.ref_name }})

            - **Dual-Track Community Validation**: Upvote/downvote drivers (*Stable* vs. *Had issues* with structured symptom tags) and security alerts (*Useful* vs. *False positive*) directly from Windows Desktop or Web — backed by Wilson confidence intervals, `/24` & `/64` subnet Sybil protection, and a strict Zero-Override rule that never weakens deterministic `Critical` or 96h `Observing` verdicts.
            - **End-to-End Security Hardening**: Strict renderer CSP (`style-src 'self'; connect-src 'none'`), Windows DPAPI (`safeStorage`) encrypted voter proofs, HTTPS + SSRF private-IP guards on custom API endpoints, denied permission/navigation handlers, and zero npm supply-chain vulnerabilities.
            - **Deterministic 96-Hour Soak Engine & Escalation Alerts**: Newly released drivers stay in `Observing` mode for 96h with a live progress bar and trigger native Windows notifications if a driver escalates to `Critical` or `High` post-launch.
            - **Installer (`DriveRadar-Setup-*.exe`) & Portable (`DriveRadar-Portable-*.exe`)**: Automatic background updates via `https://optlabs.com.br/driveradar/updates/`, 4 languages (`en`, `pt-BR`, `es`, `fr`), and 6 curated themes + OS sync.
          files: |
            desktop/dist/latest.yml
            desktop/dist/*.exe
            desktop/dist/*.blockmap
