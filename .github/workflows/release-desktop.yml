name: Build and Release DriveRadar Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for backend & i18n QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python QA dependencies
        run: pip install -r requirements.txt httpx

      - name: Run full backend & i18n QA suite
        run: python -m unittest discover -s tests -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Syntax check desktop scripts
        working-directory: desktop
        run: npm run check

      - name: Build Windows installer and portable binary
        working-directory: desktop
        run: npm run build:win

      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/dist/latest.yml")) { throw "Missing latest.yml" }
          Get-ChildItem desktop/dist -Include *.exe,*.blockmap,latest.yml -Recurse | Format-Table Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DriveRadar ${{ github.ref_name }} (Windows)
          body: |
            ## DriveRadar Desktop for Windows (${{ github.ref_name }})

            - **Deterministic 96-Hour Soak Engine (`Observing`)**: Newly released drivers stay in `Observing` mode for 4 days (`96h`) with a live soak progress bar instead of premature green `Install` badges, escalating immediately to `Critical` if severe post-launch regressions emerge.
            - **Post-Release Risk Escalation Alerts**: Native Windows notifications and verdict-change badges alert you immediately if an already-released driver escalates to `Critical` or `High` days after launch.
            - **Full Card, Modal & Tray Parity**: System tray `[CRITICAL]` / `[OBSERVING]` tags, dynamic tooltip, Crossover point breakdown, grounded signals, verdict transition history, SHA-256 copy button, and `/health`-validated API endpoint settings with one-click reset.
            - **Installer (`DriveRadar-Setup-*.exe`) & Portable (`DriveRadar-Portable-*.exe`)**: Automatic background updates via `https://optlabs.com.br/driveradar/updates/`, 4 languages (`en`, `pt-BR`, `es`, `fr`), and 6 curated themes + OS sync.
          files: |
            desktop/dist/latest.yml
            desktop/dist/*.exe
            desktop/dist/*.blockmap
